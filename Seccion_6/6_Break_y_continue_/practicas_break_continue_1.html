<!DOCTYPE html>
<html>
    <head>
        <title>Practica Break 1title>
    </head>
    <body>
        <script>
            let miArray = ['A', 'A', 'B', 'A', 'B', 'B', 'A'];

            function testLoop() {
                for (let letra of miArray) {
                    if (letra == 'B') {
                        break;
                    }
                    console.log(letra);
                }
            }

            testLoop();
        </script>
    </body>
</html>
