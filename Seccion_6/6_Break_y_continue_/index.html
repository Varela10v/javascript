<!DOCTYPE html>
<html>
    <head>
        <title>Break & Continue</title>
        <style>
            body {
                background: red;
            }
        </style>
    </head>
    <body>
        <script>
            let array1 = [10, 25, 40, 55, 30, 70, 15];

            for (let numero of array1) {
                if (numero < 50) {
                    document.write(numero + "<br>");
                } else {
                    break;
                    document.write("numero mayor a 50");
                }
            }
        </script>
    </body>
</html>
