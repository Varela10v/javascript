<!DOCTYPE html>
<html>
<head>
    <title>practicas_loop_while_1</title>
</head>
<body>

    <script>
        function testLoop(numero) {
            while (numero <= 10) {
                console.log(numero);
                numero++;
            }
        }

        let datoUsuario = prompt("Dime un numero:");
        testLoop(datoUsuario);
    </script>

</body>
</html>
