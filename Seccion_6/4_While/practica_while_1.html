<!DOCTYPE html>
<html>
<head>
    <title>While Simple</title>
</head>
<body>

    <script>
        function testLoop(vueltas) {
            let contador = 1;

            while (contador <= vueltas) {
                document.write("Vuelta: " + contador + "<br>");
                contador++; 
            }
        }

        
        let numero = prompt("Dime el numero de vueltas:");
        testLoop(numero);
    </script>

</body>
</html>
