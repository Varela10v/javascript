<!DOCTYPE html>
<html>
<head>
    <title>practica_loop_2</title>
</head>
<body>

    <script>
        let miArray = ['Mensaje 1', 'Mensaje 2', 'Mensaje 3'];

        function testLoop(lista) {
            for (let mensaje of lista) {
                console.log(mensaje);
            }
        }

        testLoop(miArray);
    </script>

</body>
</html>
