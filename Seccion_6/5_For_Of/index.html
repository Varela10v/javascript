<!DOCTYPE html>
<html>
<head>
    <title>Loop For Of</title>
</head>
<body>
    <script>
        let palabra = "Bienvenido";

        function loopear(texto) {
            for (let letra of texto) {
                document.write(letbra + "<br>");
            }
        }

        loopear(palabra);
    </script>
</body>
</html>
