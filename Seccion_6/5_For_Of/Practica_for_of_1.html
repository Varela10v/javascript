<!DOCTYPE html>
<html>
<head>
    <title>practicas_loop_for_of_1</title>
</head>
<body>

    <script>
        let miArray = 1;
        let suma = 0;

        function testLoop(lista) {
            for (let numero of lista) {
                suma = suma + numero;
            }
            console.log(suma);
        }

        testLoop(miArray);
    </script>

</body>
</html>
