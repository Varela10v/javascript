<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Recomendador de Actividades Recreativas</title>

    
    <link rel="stylesheet" href="misestilos.css">
</head>

<body>
    <div id="caja">

        <h1>Recomendador de Actividades Recreativas</h1>

        <p>Presupuesto:</p>
        <input type="number" id="presupuesto">

        <p>Cantidad de personas:</p>
        <input type="number" id="personas">

        <p>Tipo de actividad:</p>
        <select id="actividad">
            <option value=""> Seleccione </option>
            <option value="deportes">Deportes</option>
            <option value="entretenimiento">Entretenimiento</option>
            <option value="turismo">Turismo</option>
            <option value="familiares">Actividades familiares</option>
        </select>

        <br>
        <button onclick="recomendar()">Recomendar</button>
        <button onclick="reiniciar()">Reiniciar</button>

        <div id="resultado"></div>

    </div>

    <script src="misscripts.js"></script>
</body>
</html>
